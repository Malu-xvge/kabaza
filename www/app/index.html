<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#082247">
  <meta name="description" content="KABAZA — rides, deliveries, food, groceries and drinks in Salima, Malawi.">
  <title>KABAZA — Move Salima</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230b3a72'/><text x='32' y='45' font-family='Arial' font-size='40' font-weight='900' text-anchor='middle' fill='%234cc9f0'>K</text></svg>">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="boot">
    <div class="brand"><span class="brand__mark">K</span><span class="brand__word" style="color:#fff">KABAZA</span></div>

    <div class="spinner" style="border-color:rgba(255,255,255,.2);border-top-color:#4cc9f0"></div>
  </div>

  <div id="app"></div>
  <div id="toast-host" class="toast-host"></div>

  <!-- Configuration and core -->
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/router.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/permissions.js"></script>

  <!-- Feature modules -->
  <script src="js/auth.js"></script>
  <script src="js/customer/customer.js"></script>
  <script src="js/rider/rider.js"></script>
  <script src="js/admin/admin.js"></script>

  <!-- Bootstrap last -->
  <script src="js/app.js"></script>

</html>
